<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:inline="javascript">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Produtos - Vision Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide/dist/lucide.min.css" />

  <!-- Importação para Components -->
  <script th:src="@{/js/components/header.js}" defer></script>
  <script th:src="@{/js/components/footer.js}" defer></script>
  <script th:src="@{/js/components/productCard.js}" defer></script>

  <!-- Main Script -->
  <script>
     window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("header").appendChild(headerElement());
        document.getElementById("footer").appendChild(footerElement());

        const productsGrid = document.getElementById("productsGrid");
        const products = /*[[${products}]]*/ [];
        products.forEach((product) => productsGrid.appendChild(productCardComponent(product)));
     });
  </script>
</head>

      <h1 class="text-4xl lg:text-5xl font-bold mb-6">Catálogo de Produtos</h1>

      <div>
        <p class="text-xl text-white/90">Descubra nossa coleção completa de armações premium com</p>
        <p class="text-xl text-white/90">descontos exclusivos para universitários</p>
      </div>
    </section>

    <!-- Filters -->
    <div class="sticky top-0 z-10 py-8 bg-white border-b shadow-sm">
      <div
        class="container mx-auto px-4 lg:px-8 flex flex-col md:flex-row gap-4 items-center justify-between max-w-[1280px]">
        <div class="flex flex-col md:flex-row gap-4 items-center flex-1">
          <input id="searchInput" type="text" placeholder="Buscar produtos..."
            class="max-w-md pl-10 pr-4 py-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />

          <select id="categorySelect"
            class="cursor-pointer bg-white border border-gray-300 rounded-lg px-3 py-2 w-full md:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="all">Todas as Categorias</option>
            <option value="Óculos de Sol">Óculos de Sol</option>
            <option value="Óculos de Grau">Óculos de Grau</option>
            <option value="Óculos de Leitura">Óculos de Leitura</option>
            <option value="Óculos Esportivos">Óculos Esportivos</option>
          </select>
        </div>

        <div id="productCount" class="text-sm text-gray-500"></div>
      </div>
    </div>

    <!-- Products Section -->
    <section class="flex flex-col flex-1 py-16">
      <div class="container mx-auto px-4 lg:px-8 max-w-[1280px]">
          <div id="productsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
          <div id="noProducts" class="text-center py-12 text-gray-500 hidden col-span-full">
          Nenhum produto encontrado com os filtros selecionados.
        </div>
      </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>
  </div>
